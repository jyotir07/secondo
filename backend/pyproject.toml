[project]
name = "secondo-backend"
version = "0.1.0"
description = "SECONDO API: order ingestion, demand forecasting and kitchen planning for small food businesses."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "sentry-sdk[fastapi]>=2.35",
]

[project.optional-dependencies]
# TabPFN pulls in torch (CPU build below). The app runs without it and labels the fallback.
tabpfn = ["tabpfn>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Body"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
